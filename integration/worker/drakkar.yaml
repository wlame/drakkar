# Drakkar integration test configuration
# All values can be overridden with env vars: DK_CONNECTIONS__KAFKA__MAIN__BROKERS, etc.

worker:
  name_env: "WORKER_ID"
cluster:
  name: "main cluster"

sources:
  kafka:
    enabled: true
    topic: "search-requests"
    consumer_group: "drakkar-integration"
    max_poll_records: 50
    max_poll_interval: 5m
    session_timeout: 10s
    heartbeat_interval: 2s
  # --- HTTP input source ---
  #
  # Synchronous HTTP front door for the same handler pipeline that consumes
  # Kafka. Disabled by default in the shared file; only worker-1 flips it on
  # via the ``DK_SOURCES__HTTP__ENABLED=true`` env var in docker-compose.yml.
  # That arrangement deliberately leaves worker-2 / worker-3 without the HTTP
  # source to demonstrate the "load-balancer caveat" from docs/webapp.md —
  # the load_generator service hits worker-1 directly because round-robin
  # would 503 two-thirds of requests.
  #
  # ``deliver_to_sinks=false`` keeps the demo simple: HTTP responses are built
  # entirely from gathered task outputs, no per-request fan-out into the
  # Kafka/Postgres/Mongo sinks. Flip via ``DK_SOURCES__HTTP__DELIVER_TO_SINKS=true``
  # on worker-1 to exercise the sinks-enabled variant.
  http:
    enabled: false
    host: '0.0.0.0'
    # Integration convention: HTTP source port = debug-UI port + 10.
    # worker-1 serves debug on 8081 and the HTTP source on 8091. The
    # framework default is 8090; this override keeps the integration
    # cluster's port plan consistent across services.
    port: 8091
    path: '/process'
    deliver_to_sinks: false
    request_timeout: 30s
    max_concurrent: 64
    clients:
      - name: anonymous
        token: ''
        rpm: 4
      - name: tenant-A
        token: 'integration-tenant-a-token-do-not-use-in-prod'
        rpm: 60

executor:
  binary_path: "/usr/local/bin/run-rg"
  env:
    RG_COLORS: "never"              # config-level env var: passed to all ripgrep tasks
    SEARCH_CORPUS: "/tmp/search-corpus"
  max_executors: 4
  task_timeout: 2m
  window_size: 10
  max_retries: 3
  drain_timeout: 5s
  max_pending_tasks: 2000
  max_pending_bytes: 1GiB

# --- Thread pools ---
#
# threads.offload sizes the thread pool behind handler.offload(). This worker's arrange()
# runs its whole window-planning pass there (_build_scan_plan in
# handler.py: nested pattern x file loops, per-file stat/read syscalls,
# memory-tier cache probes), so that work occupies a pool thread instead
# of stalling the event loop. 2 is the framework default; stated
# explicitly so the integration environment demonstrates the knob.
# See docs/offload.md.
threads:
  offload: 2

# --- User-defined app config (docs/app-config.md) ---
#
# The reserved app: section belongs to the handler's own AppConfig model
# (integration/worker/models.py) — the framework passes it through
# unvalidated and loads it with the handler's RGAPP_ env prefix
# (docker-compose overrides worker-2's threshold via
# RGAPP_PRIORITY_MATCH_THRESHOLD). The api_key shows masked in the
# Debug UI's config reference (Application group).
app:
  priority_match_threshold: 20
  scoring_service_url: "http://scoring-stub:9000/score"
  scoring_api_key: "integration-demo-scoring-key"

# --- Sinks ---
#
# A NOTE ON NAMING in this section:
#
# Drakkar splits every sink entry into three parts:
#
#     sinks.<SINK_TYPE>.<INSTANCE_NAME>:
#         <field>: <value>
#         ...
#
#   - <SINK_TYPE> is a Drakkar KEYWORD and must be one of:
#         kafka, postgres, mongo, redis, http, filesystem
#   - <INSTANCE_NAME> is a USER-CHOSEN label — pick anything you like.
#     The handler code refers to it via `Payload(sink="<INSTANCE_NAME>")`
#     when multiple instances of the same sink type exist.
#   - The inner field names ("topic", "connection", "url", "ui_url",
#     "pool_min", "pool_max", etc.) ARE Drakkar keywords
#     and are schema-validated by pydantic.
#
# Below, "results", "priority_match_notifications",
# "archive_results_db", "hot_recent_matches_db", "archive",
# "hot_match_cache", "webhook", and "logs" are all user-chosen instance
# labels — nothing special about the names themselves.
#
# NOTE on "hot_match_cache" vs the top-level `cache:` section further
# down: the redis instance below is a SINK (external Redis server where
# the handler pushes per-task summaries, unrelated to the framework's
# in-process cache). The top-level `cache:` block configures the
# framework's own key/value cache (memory + per-worker SQLite + peer
# sync) that handlers access via `self.cache.<method>(...)`. The two
# features happen to share the "cache" word and nothing else — this
# file uses the verbose name `hot_match_cache` so it's obvious they're
# distinct.
sinks:
  kafka:
    # Default output — every search result. Referenced as sink="results".
    results:
      topic: "search-results"
      ui_url: "http://localhost:8088"
    # Lower-volume side-channel for the subset of high-match results that
    # also trigger the HTTP webhook. A separate topic so downstream
    # consumers interested only in alerts can subscribe without reading
    # the full result stream.
    priority_match_notifications:
      topic: "search-results-priority"
      ui_url: "http://localhost:8088"

  postgres:
    # The long-term archive — every search result lands here. Larger pool
    # because writes are frequent. Points at the "postgres" service.
    archive_results_db:
      connection: archive
      pool_min: 1
      pool_max: 5
      # Operator-authored SQL, invoked by name from the handler with
      # `op=statement` and bound `params`. This is the escape hatch for what
      # the declarative operations cannot express — here, a new value that
      # depends on the old one.
      #
      # Parameters are always BOUND, never interpolated, so message content
      # can never reach the statement text. `:matches` appears twice and
      # binds one value. Malformed SQL fails at startup, not at first
      # delivery; a missing column surfaces through on_delivery_error.
      statements:
        bump_pattern_stats: |
          INSERT INTO pattern_stats (pattern, total_matches, requests)
          VALUES (:pattern, :matches, 1)
          ON CONFLICT (pattern) DO UPDATE
          SET total_matches = pattern_stats.total_matches + :matches,
              requests      = pattern_stats.requests + 1,
              last_seen     = NOW()
    # A second Postgres INSTANCE, pointing at a SEPARATE database server
    # ("postgres-hot" in docker-compose.yml, DB "drakkar_hot"). Only
    # high-match results are routed here — the handler decides which
    # instance to target by setting `sink="hot_recent_matches_db"` on
    # the PostgresPayload. Small pool: this mirrors a real deployment
    # where a hot/interactive DB has tighter resource limits than the
    # archive.
    hot_recent_matches_db:
      connection: hot
      pool_min: 1
      pool_max: 2

  mongo:
    archive:
      database: "drakkar"
      ui_url: "http://localhost:8089"

  redis:
    # External Redis sink for per-task summaries (1h TTL) — this is
    # a downstream cache consumed by other services, NOT the framework's
    # in-process cache. Verbose instance name makes it clear at a
    # glance that this is "the redis-backed per-task hot match cache",
    # distinct from the framework cache configured under `cache:` below.
    hot_match_cache:
      connection: sink
      key_prefix: "drakkar:"
      ui_url: "http://localhost:8087"
      # Operator-authored Lua, invoked by name with `op=script`. Two reasons
      # it exists: multi-step logic the declarative commands cannot express,
      # and ATOMICITY — a pipeline is not a transaction, so an LPUSH and an
      # LTRIM issued as two commands can interleave with another writer,
      # while the same pair inside a script cannot.
      #
      # Values arrive as KEYS and ARGV and are never interpolated into the
      # body. Every declared key is prefixed with key_prefix, so a script
      # cannot reach outside this sink instance's namespace.
      scripts:
        push_and_cap: |
          redis.call('LPUSH', KEYS[1], ARGV[1])
          redis.call('LTRIM', KEYS[1], 0, tonumber(ARGV[2]) - 1)
          return redis.call('LLEN', KEYS[1])

  http:
    webhook:
      url: "http://webhook:8080/"
      method: "POST"
      request_timeout: 10s
      max_retries: 2
      # The alert goes out only after the hot row of the same request is
      # stored, so a dashboard that follows the link finds the row. Both come
      # from one high-match result; a result with no hot row has no
      # dependency payloads, and the webhook starts at once.
      depends_on: [postgres/hot_recent_matches_db]

  filesystem:
    logs:
      base_path: "/tmp"

dlq:
  topic: ""  # auto-derived: search-requests_dlq

metrics:
  enabled: true
  port: 9090

logging:
  level: "INFO"
  format: "json"

api:
  host: "0.0.0.0"
  port: 8080

ui:
  enabled: true
  # Timed consume pause from the Live page. Deliberately enabled on the
  # main cluster only (the fast workers stay untouched) so the demo can
  # exercise pausing without stopping all intake.
  consume_pause:
    enabled: true
  max_rows: 5000
  prometheus:
    url: "http://localhost:9099"
    rate_interval: "30s"
    worker_label: 'instance="{worker_id}:{metrics_port}"'
    cluster_label: 'cluster="main-cluster"'
  custom_links:
    - name: "Drakkar GitHub"
      url: "https://github.com/wlame/drakkar?from={worker_id}"
  # Named URL bases the probe-details layout's link templates resolve
  # against (see docs/ui-enrichment.md). Fake hostnames — this is an
  # integration demo, not a real deployment. kafka_ui is real, though:
  # it feeds the kafka_ui_batch_link_flag timeline event type below and
  # points at the same Kafka-UI instance the kafka.ui_url deep links use.
  link_bases:
    code_review: "https://code-review.integration.example.com"
    file_browser: "https://files.integration.example.com"
    build_farm: "https://builds.integration.example.com"
    kafka_ui: "http://localhost:8088"
  # Deployment-owned JS module implementing the matchBar/patternChip
  # custom cell renderers (see docs/ui-enrichment.md#custom-cell-renderers).
  # Path matches the Dockerfile's COPY target under WORKDIR /app.
  custom_renderers_path: "/app/custom-renderers.js"
  # Timeline tuning: history depth, first-match-wins bar color rules, and
  # which task label feeds each special role. tag=file_size shows the
  # human size on the bar; caption=file_name names it; highlight=lines
  # flags line count on hover; filter=module lets the UI filter by
  # scanned directory; marker=request draws one pin per Kafka batch
  # boundary (see handler.py's arrange()).
  timeline:
    history_factor: 100
    max_age: 1h
    color_rules:
      - name: empty output
        when: {field: stdout_size, op: eq, value: 0}
        color: lightgray
      - name: big file
        when: {label: file_size_bytes, op: gt, value: 10240}
        color: blue
      - name: vendored code
        when: {label: module, op: contains, value: vendor}
        color: purple
    labels:
      tag: file_size
      caption: file_name
      highlight: lines
      filter: module
      marker: request
    # Custom timeline events (docs/ui-timeline-events.md): handler-emitted
    # markers, ranges, and flag pins, distinct from the marker LABEL ROLE
    # above (which derives pins from a task label rather than an explicit
    # self.timeline_event() call). Emitted from handler.py's arrange() and
    # on_message_complete().
    events:
      - name: scan_window_processing_range
        kind: range
        color: blue
        action: highlight
      - name: ripgrep_batch_started_marker
        kind: marker
        line: dotted
        color: purple
        label: "batch {text}"
      - name: kafka_ui_batch_link_flag
        kind: flag
        color: orange
        label: "kafka {text}"
        link: "{kafka_ui}/ui/clusters/drakkar-local/all-topics/search-requests/messages?seekType=OFFSET&seekTo={partition}::{text}"
        action: link
  # --- Operator docs site (docs/ui-docs.md) ---
  #
  # A prebuilt static site served at /docs/ by this worker, plus the
  # contextual anchors that link UI surfaces into it. The site under
  # docs-site/ is hand-written HTML, not an mkdocs build: the worker
  # serves any static directory, and small files make the anchor
  # fragments (real id= attributes) easy to read. The repo root is
  # already mounted read-only at /project, so no extra volume is needed.
  #
  # Each anchor names exactly one UI surface. The two label anchors show
  # the specificity rule: the module=tests anchor wins on tasks that
  # scan the test suite, and the key-wide module anchor covers every
  # other value (tests is a module the producer really asks for, so both
  # anchors are reachable in a running harness). The sink and event
  # anchors must name things this file declares elsewhere
  # (sinks.postgres.archive_results_db and the timeline event type
  # above) — a name that matches nothing logs a startup warning and
  # renders no icon.
  docs:
    site_dir: /project/integration/worker/docs-site
    title: "Ripgrep Pipeline Handbook"
    anchors:
      - match: {label: module}
        path: scanning.html#modules
        title: "Scan target modules"
      - match: {label: module, value: tests}
        path: scanning.html#tests-module
        title: "The tests module"
      - match: {sink: archive_results_db}
        path: operations.html#archive-database
        title: "Result archive database"
      - match: {event: scan_window_processing_range}
        path: scanning.html#scan-windows
        title: "Scan window ranges"

# --- Framework cache ---
#
# The handler-facing key/value cache surfaced as `self.cache` on every
# handler. Backed by an in-memory dict for hot reads and a per-worker
# SQLite file (`<WORKER_ID>-cache.db`) for durability across restarts,
# with a periodic cache exchange that pulls the cluster/global rows of
# other workers over HTTP (GET /api/v1/peer/cache/changes) for
# cross-worker visibility.
#
# This is completely separate from the `sinks.redis.hot_match_cache`
# instance above — that is an *external* Redis service used by
# downstream consumers; this section configures the framework's
# *in-process* cache which the handler consults inside arrange() and
# populates inside on_task_complete().

# The HTTP input source is configured under sources.http above.

cache:
  # Master switch. When false, every handler.cache call becomes a no-op
  # stub (peek/get return None, set/delete silently discard) — handler
  # code runs unchanged.
  enabled: true
  # The cache file lives in storage.dir (below) and only this worker
  # opens it. Peers find each other through the registry cards and pull
  # rows over HTTP, so the cache does not need the shared volume.
  # Memory → SQLite flush cadence. Shorter = less data lost on a crash;
  # longer = fewer SQLite transactions per worker. 3s matches the
  # recorder's own flush interval for operational consistency.
  flush_interval: 3s
  # Expired-row removal cadence. 60s is fine — TTLs are checked inline
  # on every read, so expired rows are invisible to handlers even
  # between cleanup cycles; this loop only reclaims disk space.
  cleanup_interval: 1m
  # Bound the in-memory dict with LRU eviction. The SQLite file is the
  # source of truth, so evictions don't lose data — a subsequent get()
  # on an evicted key falls through to the DB. 0 means unbounded growth
  # (fine for small workers; set a cap in production).
  max_memory_entries: 10000
  # Cache exchange: pulls new cluster/global rows from the other workers
  # over HTTP, at the URL on their registry card (api.host 0.0.0.0 above
  # makes this worker reachable to them), LWW-merges them into our local
  # DB, and invalidates overlapping memory entries so the next read sees
  # the newer value.
  exchange:
    enabled: true
    interval: 30s
    page_size: 500
    timeout: 5s

# This worker's own files (recorder, cache, crash marker). The harness
# mounts one host folder at /shared in every container, so it doubles as
# the cluster's shared folder.
storage:
  dir: "/shared"
  shared_dir: "/shared"

# Shared connections that the providers below name. The DSN and the URL
# here have no password, and the Consul entry has no token:
# docker-compose.yml supplies the full DSN through
# DK_CONNECTIONS__POSTGRES__MAIN__DSN, the full URL through
# DK_CONNECTIONS__REDIS__MAIN__URL and the token through
# DK_CONNECTIONS__CONSUL__MAIN__TOKEN, so the secrets never sit in this file.
# The worker creates the Postgres schema and its tables on first use
# (manage_schema defaults to true). The Redis keys start with state_prefix,
# which is also the key pattern of the drakkar user on redis-fleet, and the
# path of the URL picks database 3. The Consul keys start with state_prefix
# and a "/", which is the key prefix of the token's policy on consul-fleet.
connections:
  kafka:
    main:
      brokers: "kafka:9092"
      # Kafka-UI deep-link config. The Debug UI renders a small Kafka icon
      # next to every <partition:offset> link; clicking it opens Kafka-UI
      # pre-filtered on (topic, partition, offset) in a new tab. Both
      # ui_url and ui_cluster_name must be set for the icon to appear; the
      # cluster_name must match the value Kafka-UI is itself configured with
      # (see docker-compose: KAFKA_CLUSTERS_0_NAME=drakkar-local).
      ui_url: "http://localhost:8088"
      ui_cluster_name: "drakkar-local"

  postgres:
    main:
      dsn: "postgresql://drakkar@postgres-fleet:5432/drakkar_fleet"
      schema: drakkar
    # The two databases of the Postgres sinks: separate servers in docker-compose.yml.
    archive:
      dsn: "postgresql://drakkar:drakkar@postgres:5432/drakkar"
    hot:
      dsn: "postgresql://drakkar:drakkar@postgres-hot:5432/drakkar_hot"
  redis:
    main:
      url: "redis://drakkar@redis-fleet:6379/3"
      state_prefix: "drakkar:"
    # The server of the Redis sink.
    sink:
      url: "redis://redis:6379/0"
  mongo:
    main:
      uri: "mongodb://mongo:27017"
  consul:
    main:
      address: "http://consul-fleet:8500"
      state_prefix: "drakkar"

# Autodiscover: the worker registry and the election of cluster tasks (the
# archive and the handler's harness_cluster_tick). The provider is filesystem
# (cards and locks in storage.shared_dir), postgres (the database of
# connections.postgres.main), redis (the Redis of connections.redis.main) or
# consul (the KV store of connections.consul.main), chosen by
# DK_AUTODISCOVER__PROVIDER in docker-compose.yml. The timings are short so
# the outage scenarios finish in minutes: a card missing for 10 s is offline,
# and one missing for 30 s is deleted. With consul a card leaves the list
# instead: its session has a 10 s TTL, and Consul deletes the card about 20 s
# after the last publish.
autodiscover:
  enabled: true
  provider: filesystem
  heartbeat: 2s
  refresh: 3s
  offline_after: 10s
  prune_after: 30s
  # Each call gets 2 s and one retry; three failed operations open the
  # breaker, which lets one probe through after 10 s. The registry and the
  # election each have a breaker of their own.
  resilience:
    timeout: 2s
    max_retries: 1
    breaker_failures: 3
    breaker_cooldown: 10s

# Archive: one-hour windows, due one hour after they end, so a window that
# integration/plant_history.py writes twelve hours back is due at once.
# Archives are kept one day (it must cover the due delay plus one window).
# An archive slot comes every 30 s, so the unclean-exit scenario need not
# wait for an hourly slot. A lease missing for 40 s is stale and another
# worker takes it over; the holder refreshes it while its pass runs.
# worker-1 turns the archive off in docker-compose.yml
# (DK_RECORDER__ARCHIVE__ENABLED), so only worker-2 and worker-3 win archive
# slots.
recorder:
  flush_interval: 3s
  max_buffer_rows: 50000
  capture:
    events: true
    config: true
    output: true
    env_vars:
      - "WORKER_ID"
      - "DK_CONFIG"
  sqlite:
    state_snapshots: true
    state_interval: 10s
    rotation_interval: 1h
  archive:
    window: 1h
    due_after: 1h
    retention: 1d
    interval: 30s
    lease: 40s

