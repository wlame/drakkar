# HTTP-only worker — the same ripgrep pipeline, fed by POST requests only.
# No Kafka consumer group is joined. Results go to one Kafka topic so they
# can be compared, by request id, with the Kafka path's search-results.

worker:
  name_env: "WORKER_ID"
# A third cluster, distinct from "main cluster" (worker-1..3) and
# "fast cluster" (fast-worker-1/2) — see the cache note near the bottom
# for why this worker's cluster identity does not need to match theirs.
cluster:
  name: "http cluster"

connections:
  kafka:
    main:
      brokers: "kafka:9092"      # still needed: the sink below is Kafka
      ui_url: "http://localhost:8088"
      ui_cluster_name: "drakkar-local"

sources:
  kafka:
    enabled: false
  http:
    enabled: true
    host: "0.0.0.0"
    port: 8092                   # convention: UI port + 10 (UI is 8086 in compose)
    path: "/process"
    deliver_to_sinks: true       # on_message_complete → mirrored_results
    request_timeout: 1m
    max_concurrent: 16
    clients:
      - name: mirror
        token: "integration-http-mirror-token-do-not-use-in-prod"
        rpm: 600                 # the producer's burst phases mirror several requests per second

executor:
  binary_path: "/usr/local/bin/run-rg"
  env:
    RG_COLORS: "never"
    SEARCH_CORPUS: "/tmp/search-corpus"
  max_executors: 2
  task_timeout: 2m
  window_size: 10
  max_retries: 1
  drain_timeout: 5s

sinks:
  kafka:
    mirrored_results:            # user-chosen instance name, referenced by KafkaPayload(sink=...)
      topic: "search-results-http"
      ui_url: "http://localhost:8088"

dlq:
  topic: ""                      # Kafka source off + empty topic = no DLQ topic (dlq=unconfigured in the summary)

metrics:
  enabled: true
  port: 9090

logging:
  level: "INFO"
  format: "json"

api:
  host: "0.0.0.0"
  port: 8080

ui:
  enabled: true
  prometheus:
    url: "http://localhost:9099"
    worker_label: 'instance="{worker_id}:{metrics_port}"'
    cluster_label: 'cluster="http-cluster"'

recorder:
  capture:
    events: true
    config: true
    output: true
    min_event_duration: 0
    env_vars: ["WORKER_ID", "DK_CONFIG", "WORKER_HANDLER"]
  sqlite:
    state_snapshots: true

# No top-level cache: block here — the framework's in-process cache stays
# disabled on this worker (every handler.cache call becomes a no-op). Its
# arrange() still runs the inherited two-tier precomputed-cache lookup, but
# that fast track can only ever hit on rows the cache exchange pulls in
# over HTTP from the Kafka workers, which needs cache.enabled=true here AND
# the same cluster.name on both sides (the Kafka workers write
# cluster-scoped rows) — neither holds here. This worker demonstrates the
# Kafka-source-off / HTTP-only path, not cross-cluster cache sharing.

# This worker's own files (recorder, cache, crash marker). Same folder as
# the main cluster's workers, so the Debug UI's workers page lists this one
# alongside them: the harness mounts one host folder at /shared in every
# container, so it doubles as the cluster's shared folder.
storage:
  dir: "/shared"
  shared_dir: "/shared"

# The workers of this cluster find each other through card files in the
# shared folder.
autodiscover:
  enabled: true
  provider: filesystem
