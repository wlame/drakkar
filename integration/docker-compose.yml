services:
  # --- Infrastructure ---

  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: drakkar-integration-test
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server=localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 10s

  kafka-init:
    image: apache/kafka:3.7.0
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infra/init-kafka.sh:/init-kafka.sh
    entrypoint: ["/bin/bash", "/init-kafka.sh"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: drakkar
      POSTGRES_PASSWORD: drakkar
      POSTGRES_DB: drakkar
    ports:
      - "5432:5432"
    volumes:
      - ./infra/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drakkar"]
      interval: 3s
      timeout: 5s
      retries: 10

  # Second Postgres instance, used to demonstrate routing to a DIFFERENT
  # database server from the same Drakkar worker. The handler picks
  # between "archive_results_db" (above) and "hot_recent_matches_db" (here)
  # via the `sink=` field on PostgresPayload. There is no special
  # relationship between these two Postgres containers — to Drakkar they
  # are simply two independent postgres sink instances with different DSNs.
  postgres-hot:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: drakkar
      POSTGRES_PASSWORD: drakkar
      POSTGRES_DB: drakkar_hot
    ports:
      - "5433:5432"
    volumes:
      - ./infra/init-db-hot.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drakkar -d drakkar_hot"]
      interval: 3s
      timeout: 5s
      retries: 10

  # Database of the main cluster's autodiscover provider
  # (the archive and the cluster tick) when the harness runs with `just integration-up provider=postgres`.
  # Separate from the sinks' database so that pausing it (the
  # service-outage scenario) touches the providers and nothing else.
  postgres-fleet:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: drakkar
      POSTGRES_PASSWORD: drakkar
      POSTGRES_DB: drakkar_fleet
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drakkar -d drakkar_fleet"]
      interval: 3s
      timeout: 5s
      retries: 10

  # Redis of the main cluster's autodiscover provider (the
  # archive and the cluster tick) when the harness runs with `just integration-up provider=redis`. Separate
  # from the sinks' Redis so that pausing it (the service-outage scenario)
  # touches the providers and nothing else. The default user is off, and
  # the only user, drakkar, holds exactly the rights that docs/security.md
  # gives the providers, so a run proves that those rights are enough. The
  # workers use database 3.
  redis-fleet:
    image: redis:7-alpine
    command:
      - redis-server
      - --user
      - default
      - "off"
      - --user
      - drakkar
      - "on"
      - ">drakkar"
      - "~drakkar:*"
      - "+@read"
      - "+@write"
      - "+@scripting"
      - "+@connection"
      - "+time"
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --user drakkar --pass drakkar --no-auth-warning ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Consul agent of the main cluster's autodiscover provider
  # (the archive and the cluster tick) when the harness runs with `just integration-up provider=consul`. A
  # single dev agent: its state lives in memory, so a new container starts
  # empty and consul-fleet-init sets it up again. ACLs are on and deny by
  # default. consul-fleet-init creates the policy drakkar-fleet with exactly
  # the two rules that docs/security.md gives the providers, and the
  # workers' token of that policy, so a run proves that those rights are
  # enough. Both UUIDs in this file, the management token below and the
  # workers' token, are harness values, not secrets. The debug log names
  # every request and every session that ends by its TTL; the unclean-exit
  # scenario reads both.
  consul-fleet:
    image: hashicorp/consul:1.21
    command:
      - agent
      - -dev
      - -client=0.0.0.0
      - -log-level=debug
      - -hcl
      - 'acl { enabled = true default_policy = "deny" tokens { initial_management = "0b7c9d4e-3f21-4a6b-8c5d-7e9f1a2b3c4d" } }'
    ports:
      - "8500:8500"
    healthcheck:
      # The leader request needs no token; the answer names the leader's
      # server port once the agent has elected itself.
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8500/v1/status/leader | grep -q 8300"]
      interval: 3s
      timeout: 3s
      retries: 10

  # One-shot: the policy and the workers' token of consul-fleet. Runs again
  # at every `just integration-up` and finds both on a running agent.
  consul-fleet-init:
    image: hashicorp/consul:1.21
    depends_on:
      consul-fleet:
        condition: service_healthy
    environment:
      CONSUL_HTTP_ADDR: http://consul-fleet:8500
      CONSUL_HTTP_TOKEN: "0b7c9d4e-3f21-4a6b-8c5d-7e9f1a2b3c4d"
      WORKER_TOKEN: "6a1f3c2e-0d4b-4c8e-9a7f-2b5e8d1c4f90"
    volumes:
      - ./infra/init-consul.sh:/init-consul.sh:ro
    entrypoint: ["/bin/sh", "/init-consul.sh"]

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  webhook:
    image: mendhak/http-https-echo:latest
    ports:
      - "9000:8080"
    environment:
      HTTP_PORT: 8080

  # --- Web UIs ---

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8088:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: drakkar-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  mongo-express:
    image: mongo-express:latest
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8089:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
      ME_CONFIG_BASICAUTH: "false"

  redis-commander:
    image: rediscommander/redis-commander:latest
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8087:8081"
    environment:
      REDIS_HOSTS: local:redis:6379

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9099:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  # --- Drakkar Workers ---

  worker-1:
    build:
      context: ..
      dockerfile: integration/worker/Dockerfile
      args:
        PYTHON_IMAGE: ${HARNESS_PYTHON_IMAGE:-python:3.13-slim}
        EXTRA_APT: ${HARNESS_EXTRA_APT:-}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      postgres-hot:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres-fleet:
        condition: service_healthy
      redis-fleet:
        condition: service_healthy
      consul-fleet-init:
        condition: service_completed_successfully
    environment:
      WORKER_ID: worker-1
      CLUSTER_ID: analytics-prod
      DK_CONFIG: /app/drakkar.yaml
      DK_METRICS__PORT: "9090"
      DK_API__PORT: "8081"
      DK_API__PUBLIC_URL: "http://localhost:8081/"
      # Autodiscover provider of the main cluster:
      # filesystem (the default), postgres, redis or consul, chosen with
      # `just integration-up provider=<name>`. The DSN and the Redis URL
      # carry the password, and the Consul token is a credential, so they
      # live here and not in drakkar.yaml.
      DK_AUTODISCOVER__PROVIDER: ${HARNESS_PROVIDER:-filesystem}
      DK_CONNECTIONS__POSTGRES__MAIN__DSN: "postgresql://drakkar:drakkar@postgres-fleet:5432/drakkar_fleet"
      DK_CONNECTIONS__REDIS__MAIN__URL: "redis://drakkar:drakkar@redis-fleet:6379/3"
      DK_CONNECTIONS__CONSUL__MAIN__TOKEN: "6a1f3c2e-0d4b-4c8e-9a7f-2b5e8d1c4f90"
      # A message whose value the input model cannot parse goes to the DLQ
      # topic as a record with dk-stage: parse (scenario-dlq-record.sh checks
      # it). Set on all three workers of the main cluster, because any of
      # them may own the partition of that message.
      DK_SOURCES__KAFKA__ON_PARSE_ERROR: "dlq"
      # HTTP source is enabled ONLY on worker-1. Worker-2 and worker-3
      # leave sources.http.enabled=false (the shared yaml default) — proving
      # the load-balancer caveat documented in docs/webapp.md: the
      # synchronous HTTP path is sticky to a single worker, and round-robin
      # load-balancing across all three would 503 two-thirds of requests.
      DK_SOURCES__HTTP__ENABLED: "true"
      # Env override of one ui.docs field, so the harness shows the docs
      # section taking DK_ overrides like any other scalar setting.
      # worker-1 labels the nav entry differently from worker-2/3, which
      # keep the yaml title; all three serve the same site.
      DK_UI__DOCS__TITLE: "Ripgrep Pipeline Handbook (worker-1)"
      # worker-1 is the observer of every scenario, so it never runs the
      # archive and never holds its lock: the unclean-exit scenario kills
      # the lock holder, and worker-1 must stay up. With the archive off,
      # worker-1's cluster task definitions differ from worker-2's and
      # worker-3's, and the cluster-tasks scenario checks that worker-2
      # shows worker-1 with cluster_tasks_match false.
      DK_RECORDER__ARCHIVE__ENABLED: "false"
      # worker-1 keeps its recorder events in memory only and writes no
      # recorder file; worker-2 and worker-3 keep the file (the default
      # provider sqlite), so sealing and the archive still
      # run. The short window lets the recorder-memory scenario see the
      # window eviction within a few minutes of the start.
      DK_RECORDER__ENABLED: "false"
      DK_RECORDER__MEMORY__WINDOW: "1m"
      # The agent surface is on with a token on worker-1 only; worker-2
      # and worker-3 keep the default (off). scenario-agent.sh reads the
      # token from this file.
      DK_AGENT__ENABLED: "true"
      DK_AGENT__AUTH_TOKEN: "harness-agent-token-worker-1-7c41d9"
    ports:
      - "9090:9090"
      - "8081:8081"
      # HTTP source port — only exposed on worker-1 because that's the only
      # worker with the HTTP source running. Integration convention: HTTP
      # source port = debug-UI port + 10 (debug 8081 → HTTP source 8091).
      - "8091:8091"
    volumes:
      - ..:/project:ro
      - ./shared:/shared
    healthcheck:
      # Reuse the debug server's /healthz endpoint as the readiness gate.
      # The HTTP source itself does not own a /healthz route — debug is
      # always up well before the HTTP source accepts requests, so a green
      # debug check is a reliable "worker process is alive" signal. The
      # load_generator service depends on this healthcheck (service_healthy)
      # so its first request lands after worker-1 has bound port 8091.
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://localhost:8081/healthz\", timeout=2).status==200 else 1)'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  worker-2:
    build:
      context: ..
      dockerfile: integration/worker/Dockerfile
      args:
        PYTHON_IMAGE: ${HARNESS_PYTHON_IMAGE:-python:3.13-slim}
        EXTRA_APT: ${HARNESS_EXTRA_APT:-}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      postgres-hot:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres-fleet:
        condition: service_healthy
      redis-fleet:
        condition: service_healthy
      consul-fleet-init:
        condition: service_completed_successfully
    environment:
      WORKER_ID: worker-2
      CLUSTER_ID: analytics-prod
      DK_CONFIG: /app/drakkar.yaml
      DK_METRICS__PORT: "9091"
      DK_API__PORT: "8082"
      DK_API__PUBLIC_URL: "http://localhost:8082/"
      # Same provider, DSN, Redis URL and Consul token as worker-1 (see there).
      DK_AUTODISCOVER__PROVIDER: ${HARNESS_PROVIDER:-filesystem}
      DK_CONNECTIONS__POSTGRES__MAIN__DSN: "postgresql://drakkar:drakkar@postgres-fleet:5432/drakkar_fleet"
      DK_CONNECTIONS__REDIS__MAIN__URL: "redis://drakkar:drakkar@redis-fleet:6379/3"
      DK_CONNECTIONS__CONSUL__MAIN__TOKEN: "6a1f3c2e-0d4b-4c8e-9a7f-2b5e8d1c4f90"
      # Same parse-error policy as worker-1 (see there).
      DK_SOURCES__KAFKA__ON_PARSE_ERROR: "dlq"
      # App-config demo (docs/app-config.md): override one field of the
      # handler-declared AppConfig via the handler's OWN env prefix —
      # never DK_APP__* (the framework rejects that). Only worker-2, so
      # the Debug UI shows a per-worker divergence from the shared yaml.
      RGAPP_PRIORITY_MATCH_THRESHOLD: "35"
    ports:
      - "9091:9091"
      - "8082:8082"
    volumes:
      - ..:/project:ro
      - ./shared:/shared

  worker-3:
    build:
      context: ..
      dockerfile: integration/worker/Dockerfile
      args:
        PYTHON_IMAGE: ${HARNESS_PYTHON_IMAGE:-python:3.13-slim}
        EXTRA_APT: ${HARNESS_EXTRA_APT:-}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      postgres-hot:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres-fleet:
        condition: service_healthy
      redis-fleet:
        condition: service_healthy
      consul-fleet-init:
        condition: service_completed_successfully
    environment:
      WORKER_ID: worker-3
      DK_CONFIG: /app/drakkar.yaml
      DK_METRICS__PORT: "9093"
      DK_API__PORT: "8083"
      DK_API__PUBLIC_URL: "http://localhost:8083/"
      # Same provider, DSN, Redis URL and Consul token as worker-1 (see there).
      DK_AUTODISCOVER__PROVIDER: ${HARNESS_PROVIDER:-filesystem}
      DK_CONNECTIONS__POSTGRES__MAIN__DSN: "postgresql://drakkar:drakkar@postgres-fleet:5432/drakkar_fleet"
      DK_CONNECTIONS__REDIS__MAIN__URL: "redis://drakkar:drakkar@redis-fleet:6379/3"
      DK_CONNECTIONS__CONSUL__MAIN__TOKEN: "6a1f3c2e-0d4b-4c8e-9a7f-2b5e8d1c4f90"
      # Same parse-error policy as worker-1 (see there).
      DK_SOURCES__KAFKA__ON_PARSE_ERROR: "dlq"
    ports:
      - "9093:9093"
      - "8083:8083"
    volumes:
      - ..:/project:ro
      - ./shared:/shared

  # --- A twin of worker-3 (profile twin) ---
  #
  # The same worker name as worker-3 in the same cluster, as if a second
  # worker-3 started on another host: its own storage.dir inside the
  # container (so the owner lock of the own folder does not see worker-3),
  # the shared folder and the registry of the main cluster. The registry's
  # same-name check must refuse its start while worker-3 runs.
  # scenario-twin-name.sh starts it and removes it; a plain
  # `just integration-up` does not start it. The recorder is off, so the
  # refused start seals no recorder file into the history folder under
  # worker-3's name. No host ports: it never serves.
  worker-3-twin:
    profiles: ["twin"]
    build:
      context: ..
      dockerfile: integration/worker/Dockerfile
      args:
        PYTHON_IMAGE: ${HARNESS_PYTHON_IMAGE:-python:3.13-slim}
        EXTRA_APT: ${HARNESS_EXTRA_APT:-}
    environment:
      WORKER_ID: worker-3
      DK_CONFIG: /app/drakkar.yaml
      DK_METRICS__PORT: "9093"
      DK_API__PORT: "8083"
      DK_STORAGE__DIR: "/tmp/twin-storage"
      DK_RECORDER__ENABLED: "false"
      # Same provider, DSN, Redis URL and Consul token as worker-1 (see there).
      DK_AUTODISCOVER__PROVIDER: ${HARNESS_PROVIDER:-filesystem}
      DK_CONNECTIONS__POSTGRES__MAIN__DSN: "postgresql://drakkar:drakkar@postgres-fleet:5432/drakkar_fleet"
      DK_CONNECTIONS__REDIS__MAIN__URL: "redis://drakkar:drakkar@redis-fleet:6379/3"
      DK_CONNECTIONS__CONSUL__MAIN__TOKEN: "6a1f3c2e-0d4b-4c8e-9a7f-2b5e8d1c4f90"
    volumes:
      - ..:/project:ro
      - ./shared:/shared

  # --- Fast Workers (symbol counting) ---

  fast-worker-1:
    build:
      context: ..
      dockerfile: integration/fast-worker/Dockerfile
      args:
        PYTHON_IMAGE: ${HARNESS_PYTHON_IMAGE:-python:3.13-slim}
        EXTRA_APT: ${HARNESS_EXTRA_APT:-}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres-fleet:
        condition: service_healthy
    environment:
      WORKER_ID: fast-worker-1
      DK_CONFIG: /app/drakkar.yaml
      DK_METRICS__PORT: "9094"
      DK_API__PORT: "8084"
      DK_API__PUBLIC_URL: "http://localhost:8084/"
      # The fast cluster keeps its recorder history in Postgres: the table
      # drakkar.fast_recorder_events on postgres-fleet, with hourly partitions
      # kept for 2 hours (scenario-recorder-postgres.sh checks it). The main
      # cluster keeps its own modes.
      DK_RECORDER__PROVIDER: "postgres"
      DK_CONNECTIONS__POSTGRES__MAIN__DSN: "postgresql://drakkar:drakkar@postgres-fleet:5432/drakkar_fleet"
      DK_RECORDER__POSTGRES__TABLE_PREFIX: "fast"
      DK_RECORDER__POSTGRES__INITIAL_RETENTION: "2h"
      # A value over 1KiB is cut to its two halves; the failed-task check of
      # scenario-recorder-postgres.sh relies on it.
      DK_RECORDER__POSTGRES__MAX_OUTPUT: "1KiB"
      # Small backpressure caps: the burst and flood phases of the producer
      # fill them, and scenario-backpressure.sh checks from the metrics that
      # the pending tasks stay at most one message's fan-out above the cap.
      # The task cap must be at least executor.max_executors (2); the byte
      # cap is the least the config allows.
      DK_EXECUTOR__MAX_PENDING_TASKS: "4"
      DK_EXECUTOR__MAX_PENDING_BYTES: "16MiB"
    ports:
      - "9094:9094"
      - "8084:8084"
    volumes:
      - ..:/project:ro
      - ./shared:/shared

  fast-worker-2:
    build:
      context: ..
      dockerfile: integration/fast-worker/Dockerfile
      args:
        PYTHON_IMAGE: ${HARNESS_PYTHON_IMAGE:-python:3.13-slim}
        EXTRA_APT: ${HARNESS_EXTRA_APT:-}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres-fleet:
        condition: service_healthy
    environment:
      WORKER_ID: fast-worker-2
      DK_CONFIG: /app/drakkar.yaml
      DK_METRICS__PORT: "9095"
      DK_API__PORT: "8085"
      DK_API__PUBLIC_URL: "http://localhost:8085/"
      # Postgres recorder history, as fast-worker-1 (see there).
      DK_RECORDER__PROVIDER: "postgres"
      DK_CONNECTIONS__POSTGRES__MAIN__DSN: "postgresql://drakkar:drakkar@postgres-fleet:5432/drakkar_fleet"
      DK_RECORDER__POSTGRES__TABLE_PREFIX: "fast"
      DK_RECORDER__POSTGRES__INITIAL_RETENTION: "2h"
      # A value over 1KiB is cut to its two halves; the failed-task check of
      # scenario-recorder-postgres.sh relies on it.
      DK_RECORDER__POSTGRES__MAX_OUTPUT: "1KiB"
    ports:
      - "9095:9095"
      - "8085:8085"
    volumes:
      - ..:/project:ro
      - ./shared:/shared

  # --- Headless workers (profile headless) ---
  #
  # Two workers of the symbol-counting pipeline without the parts a worker
  # may leave out; scenario-headless.sh starts and stops them, so a plain
  # `just integration-up` does not. Each has its own consumer group and its
  # own cluster, so it takes no partition from the fast cluster and joins no
  # registry.
  #
  # headless-recorder serves only the API (/healthz, /readyz) and records
  # to its recorder file. headless-no-api has no HTTP server, no UI and no
  # recorder; its metrics port is the only way to see that it works.
  headless-recorder:
    profiles: ["headless"]
    build:
      context: ..
      dockerfile: integration/fast-worker/Dockerfile
      args:
        PYTHON_IMAGE: ${HARNESS_PYTHON_IMAGE:-python:3.13-slim}
        EXTRA_APT: ${HARNESS_EXTRA_APT:-}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      WORKER_ID: headless-recorder
      DK_CONFIG: /app/drakkar.yaml
      DK_CLUSTER__NAME: "headless cluster"
      DK_SOURCES__KAFKA__CONSUMER_GROUP: "drakkar-headless-recorder"
      DK_METRICS__PORT: "9097"
      DK_API__PORT: "8093"
      DK_UI__ENABLED: "false"
      # The stop gives the recorder only the time the drain leaves, so the
      # drain gets enough that the sealed file is always moved into the
      # shared folder.
      DK_EXECUTOR__DRAIN_TIMEOUT: "30s"
      # The group starts at the earliest offset, so the worker finds the
      # whole backlog of the producer. A small task cap keeps the tasks it
      # has admitted few, so the stop drains them well within the drain
      # timeout; the messages not yet admitted are dropped at the stop.
      DK_EXECUTOR__MAX_PENDING_TASKS: "8"
      # The backlog holds messages whose path is a large folder (/project);
      # counting one runs for many seconds. The short task timeout ends such
      # a task well before the drain timeout, so the stop keeps time to move
      # the sealed file.
      DK_EXECUTOR__TASK_TIMEOUT: "5s"
      DK_RECORDER__ENABLED: "true"
      DK_RECORDER__ARCHIVE__ENABLED: "false"
      DK_AUTODISCOVER__ENABLED: "false"
      # The agent surface answers with the UI off (scenario-agent.sh).
      DK_AGENT__ENABLED: "true"
      DK_AGENT__AUTH_TOKEN: "harness-agent-token-headless-3e8a52"
    ports:
      - "9097:9097"
      - "8093:8093"
    volumes:
      - ..:/project:ro
      - ./shared:/shared

  headless-no-api:
    profiles: ["headless"]
    build:
      context: ..
      dockerfile: integration/fast-worker/Dockerfile
      args:
        PYTHON_IMAGE: ${HARNESS_PYTHON_IMAGE:-python:3.13-slim}
        EXTRA_APT: ${HARNESS_EXTRA_APT:-}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      WORKER_ID: headless-no-api
      DK_CONFIG: /app/drakkar.yaml
      DK_CLUSTER__NAME: "headless cluster"
      DK_SOURCES__KAFKA__CONSUMER_GROUP: "drakkar-headless-no-api"
      DK_METRICS__PORT: "9098"
      DK_API__ENABLED: "false"
      DK_UI__ENABLED: "false"
      DK_EXECUTOR__DRAIN_TIMEOUT: "30s"
      # The same small task cap and short task timeout as headless-recorder
      # (see there).
      DK_EXECUTOR__MAX_PENDING_TASKS: "8"
      DK_EXECUTOR__TASK_TIMEOUT: "5s"
      DK_RECORDER__ENABLED: "false"
      DK_AUTODISCOVER__ENABLED: "false"
    ports:
      - "9098:9098"
    volumes:
      - ..:/project:ro
      - ./shared:/shared

  # --- HTTP-only worker (http cluster) ---
  #
  # Runs the ripgrep pipeline with the Kafka source disabled. The producer
  # mirrors ~1% of its messages here over HTTP (HTTP_MIRROR_RATIO); results
  # land in the search-results-http topic for a by-request-id comparison
  # with search-results in Kafka-UI. Nothing verifies these — it is a demo.
  http-worker:
    build:
      context: ..
      dockerfile: integration/worker/Dockerfile
      args:
        PYTHON_IMAGE: ${HARNESS_PYTHON_IMAGE:-python:3.13-slim}
        EXTRA_APT: ${HARNESS_EXTRA_APT:-}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      WORKER_ID: http-worker
      WORKER_HANDLER: http-search
      DK_CONFIG: /app/http-worker.yaml
      DK_METRICS__PORT: "9096"
      DK_API__PORT: "8086"
      DK_API__PUBLIC_URL: "http://localhost:8086/"
    ports:
      - "9096:9096"
      - "8086:8086"
      - "8092:8092"
    volumes:
      - ..:/project:ro
      - ./shared:/shared
    healthcheck:
      # /readyz, not /healthz: an HTTP-only worker is ready as soon as its
      # HTTP source is bound, which is exactly what this proves.
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://localhost:8086/readyz\", timeout=2).status==200 else 1)'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # --- Message Producer ---

  producer:
    build:
      context: ..
      dockerfile: integration/infra/Dockerfile.producer
      args:
        PYTHON_IMAGE: ${HARNESS_PYTHON_IMAGE:-python:3.13-slim}
        EXTRA_APT: ${HARNESS_EXTRA_APT:-}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      http-worker:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:9092
      SOURCE_TOPIC: search-requests
      # Overridable so CI can run a small, fast corpus: the scheduled
      # job verifies delivery end to end and does not need 5000 messages
      # to do it. Request ids are 1..TOTAL_MESSAGES either way.
      TOTAL_MESSAGES: "${TOTAL_MESSAGES:-5000}"
      # Scales both ranges of the per-message repeat count (see just
      # integration-up profile=quick).
      REPEAT_SCALE: "${REPEAT_SCALE:-1.0}"
      # Mirror ~1% of generated messages to the HTTP-only worker so its
      # search-results-http topic gets a trickle of the same requests the
      # Kafka path processes (read by the producer in a later task).
      HTTP_MIRROR_RATIO: "0.01"
      HTTP_MIRROR_URL: "http://http-worker:8092/process"
      HTTP_MIRROR_TOKEN: "integration-http-mirror-token-do-not-use-in-prod"

  # --- HTTP Load Generator ---
  #
  # Drives the worker-1 HTTP source on a 10-second cycle. Anonymous by
  # default (CLIENT_TOKEN unset → matches the ``anonymous`` client at
  # rpm=4). At one request every 10 seconds the anonymous limit is comfortably
  # under the rpm=4 cap, so 200 OK is the steady state. Set INTERVAL_SECONDS
  # to a small value (e.g. "2") to demonstrate the 429 path, or run the
  # ``load_generator_tenant_a`` profile (commented below) to exercise the
  # higher-rpm tenant.
  load_generator:
    build:
      context: ./load_generator
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: ${HARNESS_PYTHON_IMAGE:-python:3.13-slim}
    depends_on:
      worker-1:
        condition: service_healthy
    environment:
      WORKER_HOST: worker-1
      WORKER_PORT: "8091"
      WORKER_PATH: "/process"
      INTERVAL_SECONDS: "10"
      RANK_SCORE_MIN: "1"
      RANK_SCORE_MAX: "20"
    # Restart on failure so a brief worker restart during chaos tests
    # doesn't kill the demo. ``no`` would be wrong — the loop catches its
    # own connection errors, so a hard exit means something unexpected.
    restart: on-failure

  # Tenant-A load generator. Disabled by default (assigned to the ``tenant``
  # profile so ``docker compose up`` won't start it). Enable explicitly with:
  #   docker compose --profile tenant up load_generator_tenant_a
  # Drives the same endpoint with the ``tenant-A`` token at a tighter
  # interval to demonstrate the higher rpm=60 cap.
  load_generator_tenant_a:
    profiles: ["tenant"]
    build:
      context: ./load_generator
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: ${HARNESS_PYTHON_IMAGE:-python:3.13-slim}
    depends_on:
      worker-1:
        condition: service_healthy
    environment:
      WORKER_HOST: worker-1
      WORKER_PORT: "8091"
      WORKER_PATH: "/process"
      CLIENT_TOKEN: "integration-tenant-a-token-do-not-use-in-prod"
      INTERVAL_SECONDS: "2"
      RANK_SCORE_MIN: "5"
      RANK_SCORE_MAX: "30"
    restart: on-failure
