services:
  # --- Infrastructure ---

  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: drakkar-integration-test
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server=localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 10s

  kafka-init:
    image: apache/kafka:3.7.0
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infra/init-kafka.sh:/init-kafka.sh
    entrypoint: ["/bin/bash", "/init-kafka.sh"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: drakkar
      POSTGRES_PASSWORD: drakkar
      POSTGRES_DB: drakkar
    ports:
      - "5432:5432"
    volumes:
      - ./infra/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drakkar"]
      interval: 3s
      timeout: 5s
      retries: 10

  # Second Postgres instance, used to demonstrate routing to a DIFFERENT
  # database server from the same Drakkar worker. The handler picks
  # between "archive_results_db" (above) and "hot_recent_matches_db" (here)
  # via the `sink=` field on PostgresPayload. There is no special
  # relationship between these two Postgres containers — to Drakkar they
  # are simply two independent postgres sink instances with different DSNs.
  postgres-hot:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: drakkar
      POSTGRES_PASSWORD: drakkar
      POSTGRES_DB: drakkar_hot
    ports:
      - "5433:5432"
    volumes:
      - ./infra/init-db-hot.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drakkar -d drakkar_hot"]
      interval: 3s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  webhook:
    image: mendhak/http-https-echo:latest
    ports:
      - "9000:8080"
    environment:
      HTTP_PORT: 8080

  # --- Web UIs ---

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8088:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: drakkar-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  mongo-express:
    image: mongo-express:latest
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8089:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
      ME_CONFIG_BASICAUTH: "false"

  redis-commander:
    image: rediscommander/redis-commander:latest
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8087:8081"
    environment:
      REDIS_HOSTS: local:redis:6379

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9099:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  # --- Drakkar Workers ---

  worker-1:
    build:
      context: ..
      dockerfile: integration/worker/Dockerfile
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      postgres-hot:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      WORKER_ID: worker-1
      DK_CONFIG: /app/drakkar.yaml
      DK_METRICS__PORT: "9090"
      DK_UI__PORT: "8081"
      DK_UI__PUBLIC_URL: "http://localhost:8081/"
      # Webapp pipeline is enabled ONLY on worker-1. Worker-2 and worker-3
      # leave webapp.enabled=false (the shared yaml default) — proving the
      # load-balancer caveat documented in docs/webapp.md: the synchronous
      # HTTP path is sticky to a single worker, and round-robin
      # load-balancing across all three would 503 two-thirds of requests.
      DK_WEBAPP__ENABLED: "true"
    ports:
      - "9090:9090"
      - "8081:8081"
      # Webapp port — only exposed on worker-1 because that's the only
      # worker with the webapp pipeline running. Integration convention:
      # webapp port = debug-UI port + 10 (debug 8081 → webapp 8091).
      - "8091:8091"
    volumes:
      - ..:/project:ro
      - ./shared:/shared
    healthcheck:
      # Reuse the debug server's /healthz endpoint as the readiness gate.
      # The webapp itself does not own a /healthz route — debug is always
      # up well before the webapp accepts requests, so a green debug check
      # is a reliable "worker process is alive" signal. The load_generator
      # service depends on this healthcheck (service_healthy) so its first
      # request lands after worker-1 has bound port 8091.
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://localhost:8081/healthz\", timeout=2).status==200 else 1)'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  worker-2:
    build:
      context: ..
      dockerfile: integration/worker/Dockerfile
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      postgres-hot:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      WORKER_ID: worker-2
      DK_CONFIG: /app/drakkar.yaml
      DK_METRICS__PORT: "9091"
      DK_UI__PORT: "8082"
      DK_UI__PUBLIC_URL: "http://localhost:8082/"
    ports:
      - "9091:9091"
      - "8082:8082"
    volumes:
      - ..:/project:ro
      - ./shared:/shared

  worker-3:
    build:
      context: ..
      dockerfile: integration/worker/Dockerfile
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      postgres-hot:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      WORKER_ID: worker-3
      DK_CONFIG: /app/drakkar.yaml
      DK_METRICS__PORT: "9093"
      DK_UI__PORT: "8083"
      DK_UI__PUBLIC_URL: "http://localhost:8083/"
    ports:
      - "9093:9093"
      - "8083:8083"
    volumes:
      - ..:/project:ro
      - ./shared:/shared

  # --- Fast Workers (symbol counting) ---

  fast-worker-1:
    build:
      context: ..
      dockerfile: integration/fast-worker/Dockerfile
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      WORKER_ID: fast-worker-1
      DK_CONFIG: /app/drakkar.yaml
      DK_METRICS__PORT: "9094"
      DK_UI__PORT: "8084"
      DK_UI__PUBLIC_URL: "http://localhost:8084/"
    ports:
      - "9094:9094"
      - "8084:8084"
    volumes:
      - ..:/project:ro
      - ./shared:/shared

  fast-worker-2:
    build:
      context: ..
      dockerfile: integration/fast-worker/Dockerfile
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      WORKER_ID: fast-worker-2
      DK_CONFIG: /app/drakkar.yaml
      DK_METRICS__PORT: "9095"
      DK_UI__PORT: "8085"
      DK_UI__PUBLIC_URL: "http://localhost:8085/"
    ports:
      - "9095:9095"
      - "8085:8085"
    volumes:
      - ..:/project:ro
      - ./shared:/shared

  # --- Message Producer ---

  producer:
    build:
      context: ..
      dockerfile: integration/infra/Dockerfile.producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: kafka:9092
      SOURCE_TOPIC: search-requests
      TOTAL_MESSAGES: "5000"

  # --- HTTP Load Generator ---
  #
  # Drives the worker-1 webapp pipeline on a 10-second cycle. Anonymous by
  # default (CLIENT_TOKEN unset → matches the ``anonymous`` client at
  # rpm=4). At one request every 10 seconds the anonymous limit is comfortably
  # under the rpm=4 cap, so 200 OK is the steady state. Set INTERVAL_SECONDS
  # to a small value (e.g. "2") to demonstrate the 429 path, or run the
  # ``load_generator_tenant_a`` profile (commented below) to exercise the
  # higher-rpm tenant.
  load_generator:
    build:
      context: ./load_generator
      dockerfile: Dockerfile
    depends_on:
      worker-1:
        condition: service_healthy
    environment:
      WORKER_HOST: worker-1
      WORKER_PORT: "8091"
      WORKER_PATH: "/process"
      INTERVAL_SECONDS: "10"
      RANK_SCORE_MIN: "1"
      RANK_SCORE_MAX: "20"
    # Restart on failure so a brief worker restart during chaos tests
    # doesn't kill the demo. ``no`` would be wrong — the loop catches its
    # own connection errors, so a hard exit means something unexpected.
    restart: on-failure

  # Tenant-A load generator. Disabled by default (assigned to the ``tenant``
  # profile so ``docker compose up`` won't start it). Enable explicitly with:
  #   docker compose --profile tenant up load_generator_tenant_a
  # Drives the same endpoint with the ``tenant-A`` token at a tighter
  # interval to demonstrate the higher rpm=60 cap.
  load_generator_tenant_a:
    profiles: ["tenant"]
    build:
      context: ./load_generator
      dockerfile: Dockerfile
    depends_on:
      worker-1:
        condition: service_healthy
    environment:
      WORKER_HOST: worker-1
      WORKER_PORT: "8091"
      WORKER_PATH: "/process"
      CLIENT_TOKEN: "integration-tenant-a-token-do-not-use-in-prod"
      INTERVAL_SECONDS: "2"
      RANK_SCORE_MIN: "5"
      RANK_SCORE_MAX: "30"
    restart: on-failure
