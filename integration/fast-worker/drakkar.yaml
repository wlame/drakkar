# Fast worker config — symbol counting pipeline
# Same source topic, different consumer group

worker:
  name_env: "WORKER_ID"
cluster:
  name: "fast cluster"

connections:
  kafka:
    main:
      brokers: "kafka:9092"
      # Kafka-UI deep-link config — renders a clickable Kafka icon next to
      # every <partition:offset> in the Debug UI that opens the message in
      # Kafka-UI. Must match the cluster name Kafka-UI itself is configured
      # with (docker-compose: KAFKA_CLUSTERS_0_NAME=drakkar-local).
      ui_url: "http://localhost:8088"
      ui_cluster_name: "drakkar-local"

sources:
  kafka:
    enabled: true
    topic: "search-requests"
    consumer_group: "drakkar-fast"
    max_poll_records: 50
    max_poll_interval: 5m
    session_timeout: 45s
    heartbeat_interval: 3s
  # No http block: the fast worker only serves the Kafka pipeline.

executor:
  binary_path: "/usr/local/bin/count-symbols"
  max_executors: 2
  task_timeout: 30s
  window_size: 10
  max_retries: 1
  drain_timeout: 5s
  backpressure_high_multiplier: 32
  backpressure_low_multiplier: 4

sinks:
  # --- Kafka sink instances ---
  #
  # Two separate Kafka output streams.
  #
  # NAMING NOTE: the labels "per_message_counts" and "window_summaries"
  # below are USER-CHOSEN instance names — they are NOT Drakkar keywords.
  # You could rename them to anything (e.g. "foo", "bar"); the handler
  # would just need to reference the new name via `KafkaPayload(sink=...)`.
  #
  # The reserved/framework keywords on this tree are only:
  #   - "sinks"        (top-level section marker)
  #   - "kafka"        (sink type — one of kafka/postgres/mongo/...)
  #   - "topic"        (field within a kafka sink instance)
  #   - "ui_url"       (field within a kafka sink instance)
  #
  # Everything at "sinks.kafka.<your-name-here>" is user-chosen.
  kafka:
    per_message_counts:
      # Written to by collect(): one record per input message, fine-grained.
      topic: "symbol-counts"
      ui_url: "http://localhost:8088"
    window_summaries:
      # Written to by on_window_complete(): one record per completed
      # arrange() window, aggregated statistics. Lower rate, wider per
      # record. Useful for dashboards or downstream batch jobs that don't
      # need per-file detail.
      topic: "symbol-count-windows"
      ui_url: "http://localhost:8088"

dlq:
  topic: ""  # auto-derived: search-requests_dlq

metrics:
  enabled: true
  port: 9090

logging:
  level: "INFO"
  format: "json"
  min_task_duration: 100ms       # log slow tasks above 100ms

api:
  host: "0.0.0.0"
  port: 8080

ui:
  enabled: true
  max_rows: 5000
  # Duration threshold — tuned down for fast tasks (most finish in <100ms)
  ws_min_duration: 100ms         # stream all but the fastest to live UI
  prometheus:
    url: "http://localhost:9099"
    rate_interval: "30s"
    worker_label: 'instance="{worker_id}:{metrics_port}"'
    cluster_label: 'cluster="fast-cluster"'
  custom_links:
    - name: "Drakkar GitHub"
      url: "https://github.com/wlame/drakkar?from={worker_id}"

recorder:
  flush_interval: 3s
  max_buffer_rows: 50000
  capture:
    events: true
    config: true
    output: true
    env_vars:
      - "WORKER_ID"
      - "DK_CONFIG"
    min_event_duration: 0          # write all task events to DB
    min_output_duration: 100ms     # only store stdout/stderr/args for tasks above 100ms
  sqlite:
    state_snapshots: true
    state_interval: 10s
    rotation_interval: 1h

# This worker's own files (recorder, cache, crash marker). The harness
# mounts one host folder at /shared in every container, so it doubles as
# the cluster's shared folder.
storage:
  dir: "/shared"
  shared_dir: "/shared"

# The workers of this cluster find each other through card files in the
# shared folder.
autodiscover:
  enabled: true
  provider: filesystem
