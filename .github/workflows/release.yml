name: Release

# Quality gates call `just` recipes (see justfile) so the release pipeline
# enforces exactly what `just ci` enforces locally.

on:
  release:
    types: [published]

# Least privilege: only the publish job needs a token with any write scope,
# and it declares its own id-token: write below.
permissions:
  contents: read

# Never cancel a release in flight — doing the work twice is cheaper than
# stopping midway through a publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"

      - uses: extractions/setup-just@v4

      - name: Check the lockfile is current
        run: just lock-check

      - name: Check formatting
        run: just fmt-check

      - name: Lint with ruff
        run: just lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"

      - uses: extractions/setup-just@v4

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: just install

      - name: Type check with ty
        if: matrix.python-version == '3.14'
        run: just typecheck

      - name: Run tests with coverage
        run: just cover

  verify-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"

      - uses: extractions/setup-just@v4

      - name: Verify tag matches package version
        env:
          GIT_TAG: ${{ github.ref_name }}
        run: |
          TAG="${GIT_TAG#v}"
          PKG_VERSION=$(just version)
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "Error: tag v$TAG does not match __version__ = '$PKG_VERSION'"
            exit 1
          fi
          echo "Tag v$TAG matches package version $PKG_VERSION"

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify-tag
    environment: pypi
    # A job-level block REPLACES the workflow-level one rather than merging
    # with it, so contents: read has to be repeated here — actions/checkout
    # needs it. id-token: write is what PyPI trusted publishing exchanges.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"

      - uses: extractions/setup-just@v4

      - name: Build package
        run: just build

      - name: Verify build artifacts
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
