name: Release

# Quality gates call `just` recipes (see justfile) so the release pipeline
# enforces exactly what `just ci` enforces locally.

on:
  release:
    types: [published]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - uses: extractions/setup-just@v4

      - name: Check formatting
        run: just fmt-check

      - name: Lint with ruff
        run: just lint

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - uses: extractions/setup-just@v4

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: just install

      - name: Type check with ty
        if: matrix.python-version == '3.14'
        run: just typecheck

      - name: Run tests with coverage
        run: just cover

  verify-tag:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - uses: extractions/setup-just@v4

      - name: Verify tag matches package version
        env:
          GIT_TAG: ${{ github.ref_name }}
        run: |
          TAG="${GIT_TAG#v}"
          PKG_VERSION=$(just version)
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "Error: tag v$TAG does not match __version__ = '$PKG_VERSION'"
            exit 1
          fi
          echo "Tag v$TAG matches package version $PKG_VERSION"

  publish:
    runs-on: ubuntu-latest
    needs: verify-tag
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - uses: extractions/setup-just@v4

      - name: Build package
        run: just build

      - name: Verify build artifacts
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
