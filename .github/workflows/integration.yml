name: Integration

# The Docker harness (Kafka, Postgres, Mongo, Redis, 3 workers, load
# generator) is the only gate that exercises boot ordering, rebalance under
# load, drain-on-shutdown, and real sink delivery. Run it on a schedule so it
# is not left to a manual `just integration-up`.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: extractions/setup-just@v4

      - name: Start the harness
        run: just integration-up

      - name: Wait for all three workers to report ready
        run: |
          for port in 8081 8082 8083; do
            for attempt in $(seq 1 60); do
              if curl -fsS "http://localhost:${port}/readyz" >/dev/null 2>&1; then
                echo "worker on ${port}: ready"
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                echo "worker on ${port}: NOT ready after 300s"
                exit 1
              fi
              sleep 5
            done
          done

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f integration/docker-compose.yml logs --tail=200

      - name: Tear down
        if: always()
        run: just integration-down
