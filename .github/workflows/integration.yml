name: Integration

# The Docker harness (Kafka, Postgres, Mongo, Redis, 3 workers, load
# generator) is the only gate that exercises boot ordering, rebalance under
# load, drain-on-shutdown, and real sink delivery. Run it on a schedule so it
# is not left to a manual `just integration-up`.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# Least privilege: the harness only reads the repository.
permissions:
  contents: read

# One harness at a time — two would fight over the same host ports.
concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harness:
    name: harness (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The experimental lane may fail for reasons that are not ours (missing
    # cp-next wheels, interpreter bugs in the RC); it reports, never gates.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: stable
            experimental: false
          # Experimental: every harness image rebuilt on the next CPython's
          # release-candidate Docker image. C extensions have no cp-next
          # wheels during the RC phase, so the images compile them from
          # source — hence the extra apt packages.
          - name: python-3.15-rc
            experimental: true
            python-image: "python:3.15-rc-slim"
            extra-apt: "build-essential librdkafka-dev"
    env:
      # Read by docker-compose.yml as image build args; empty values mean
      # the stable defaults baked into the Dockerfiles.
      HARNESS_PYTHON_IMAGE: ${{ matrix.python-image || '' }}
      HARNESS_EXTRA_APT: ${{ matrix.extra-apt || '' }}
      # Small corpus on purpose. The default 5000 (x2 with the flood phase)
      # takes far longer than this job's budget, and the delivery checks are
      # just as conclusive on 300 requests: they compare against the exact
      # produced id set, not a sample. Read by docker-compose.yml for the
      # producer and by the verify step for the expected set — one value, so
      # the two cannot disagree.
      TOTAL_MESSAGES: "300"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"

      - uses: extractions/setup-just@v4

      - name: Start the harness
        run: just integration-up

      - name: Wait for all three workers to report ready
        run: |
          for port in 8081 8082 8083; do
            for attempt in $(seq 1 60); do
              if curl -fsS "http://localhost:${port}/readyz" >/dev/null 2>&1; then
                echo "worker on ${port}: ready"
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                echo "worker on ${port}: NOT ready after 300s"
                exit 1
              fi
              sleep 5
            done
          done

      - name: Wait for the producer to finish sending
        run: |
          for attempt in $(seq 1 60); do
            if docker compose -f integration/docker-compose.yml logs producer 2>/dev/null | grep -q PRODUCER_DONE; then
              echo "producer finished"
              exit 0
            fi
            sleep 10
          done
          echo "producer did not finish within 600s"
          docker compose -f integration/docker-compose.yml logs --tail=50 producer
          exit 1

      # The gate this job exists for. Everything above proves the containers
      # came up; this proves the framework did its job — every message the
      # producer sent reached its sinks, nothing arrived that was never sent,
      # and payload order survived. It waits for the pipeline to drain first,
      # because an in-flight request is indistinguishable from a lost one.
      - name: Verify delivery
        run: just verify-delivery "$TOTAL_MESSAGES" --wait-seconds=600

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f integration/docker-compose.yml logs --tail=200

      - name: Tear down
        if: always()
        run: just integration-down
