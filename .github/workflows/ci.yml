name: CI

# All steps call `just` recipes (see justfile) so local `just ci`
# and GitHub CI run exactly the same commands.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: nothing here writes to the repository. Widen per job if
# that ever changes, never here.
permissions:
  contents: read

# A new push to the same ref makes the previous run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"

      - uses: extractions/setup-just@v4

      - name: Check the lockfile is current
        run: just lock-check

      - name: Check formatting
        run: just fmt-check

      - name: Lint with ruff
        run: just lint

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"

      - uses: extractions/setup-just@v4

      - name: Dependency CVE scan
        run: just audit

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    # The experimental lane may fail for reasons that are not ours (missing
    # cp-next wheels, interpreter bugs in the RC); it reports, never gates.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
        experimental: [false]
        include:
          # Experimental: the next CPython, whichever candidate is current.
          #
          # The interpreter request floats. python-build-standalone publishes
          # a candidate days after python.org does, so pinning an exact one
          # fails with "no download found" until it catches up, while "3.15"
          # resolves to the newest 3.15 build on offer.
          #
          # uv stays pinned to an explicit version, as everywhere else in
          # this repository — a floating tool version breaks a build for
          # reasons unrelated to the change (tests/test_ci_workflows.py).
          # The pin has a second effect worth knowing: the downloadable
          # interpreters are compiled into each uv release, so this lane
          # reaches a newer candidate only once uv is bumped to a release
          # that carries it. That bump is deliberate and reviewable rather
          # than automatic, which is the trade this invariant is making.
          - python-version: "3.15"
            experimental: true
            uv-version: "0.12.8"
    env:
      # Pin every uv invocation (sync, run) to the lane's interpreter, so a
      # pre-release lane cannot silently fall back to a stable interpreter.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ matrix.uv-version || '0.11.32' }}

      - uses: extractions/setup-just@v4

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      # No cp-next wheels exist during the RC phase, so C extensions build
      # from source; confluent-kafka needs the librdkafka headers for that
      # (the compilers themselves are preinstalled on the runner).
      #
      # The headers have to be built, not installed: every distribution
      # package is older than the version confluent-kafka's own header guard
      # demands, which fails the build with "requires librdkafka v2.15.0 or
      # later". libssl-dev and libsasl2-dev are what librdkafka feature-tests
      # against, so the build keeps the TLS and SASL support the wheels have.
      - name: Install C-extension build dependencies
        if: matrix.experimental
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev libsasl2-dev zlib1g-dev
          just install-librdkafka

      - name: Install dependencies
        if: ${{ !matrix.experimental }}
        run: just install

      # Without extras: orjson (the perf extra) is Rust and routinely lags
      # new interpreters; the lane measures Drakkar, not its optional deps.
      - name: Install dependencies without extras
        if: matrix.experimental
        run: just install-minimal

      # The lane floats to whatever candidate is current, so the run has to
      # say which interpreter it actually tested against.
      - name: Report the interpreter under test
        if: matrix.experimental
        run: uv run python -VV

      - name: Type check with ty
        if: matrix.python-version == '3.14'
        run: just typecheck

      - name: Run tests with coverage
        if: ${{ !matrix.experimental }}
        run: just cover

      # Plain test run: the question here is "does Drakkar work on the next
      # CPython", and a coverage floor would only add noise to the answer.
      - name: Run tests without the coverage gate
        if: matrix.experimental
        run: just test

      - name: Upload coverage artifact
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.xml
            junit.xml

      - name: Coverage summary
        if: always() && hashFiles('.coverage') != ''
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
