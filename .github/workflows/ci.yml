name: CI

# All steps call `just` recipes (see justfile) so local `just ci`
# and GitHub CI run exactly the same commands.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: nothing here writes to the repository. Widen per job if
# that ever changes, never here.
permissions:
  contents: read

# A new push to the same ref makes the previous run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"

      - uses: extractions/setup-just@v4

      - name: Check formatting
        run: just fmt-check

      - name: Lint with ruff
        run: just lint

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"

      - uses: extractions/setup-just@v4

      - name: Dependency CVE scan
        run: just audit

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"

      - uses: extractions/setup-just@v4

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: just install

      - name: Type check with ty
        if: matrix.python-version == '3.14'
        run: just typecheck

      - name: Run tests with coverage
        run: just cover

      - name: Upload coverage artifact
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.xml
            junit.xml

      - name: Coverage summary
        if: always() && hashFiles('.coverage') != ''
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
