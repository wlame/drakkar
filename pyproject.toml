[project]
name = "py-drakkar"
dynamic = ["version"]
description = "Kafka subprocess orchestration framework"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    { name = "wlame" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "confluent-kafka>=2.6.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.14.2",
    "asyncpg>=0.30.0",
    "prometheus-client>=0.21.0",
    "structlog>=24.4.0",
    "pyyaml>=6.0.2",
    "aiosqlite>=0.20.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.0",
    "pymongo>=4.16.0",
    "httpx>=0.27.0",
    "redis>=5.2.0",
]

[project.scripts]
# Cache-management CLI for the decoupled drakkar-ui bundle; mirrors the Go
# backend's cmd/drakkar-ui (same subcommands, flags, output, exit codes).
drakkar-ui = "drakkar.uihost.cli:main"

# Two dev lists by design: `just test` resolves from this extra, `just typecheck`
# from [dependency-groups]. Keep the shared pins identical across both.
[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "httpx>=0.27.0",
    "httpx2>=2.9.1",
    "ruff>=0.11.0",
]
perf = [
    "orjson>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "drakkar/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["drakkar"]
artifacts = ["drakkar/templates/**", "drakkar/uihost/bundle/**", "drakkar/uiserver/openapi.yaml", "drakkar/uiserver/swagger/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers -v"

[tool.coverage.run]
source = ["drakkar"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 95

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "ANN",   # flake8-annotations
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific
]
ignore = [
    "ANN401", # dynamically typed expressions (Any)
    "ANN202", # missing return type for nested/private functions (FastAPI route handlers)
    "ANN002", # missing type annotation for *args
    "ANN003", # missing type annotation for **kwargs
    "E501",   # line too long (handled by formatter)
    "SIM105", # contextlib.suppress — doesn't work with async try/except
    "UP046",  # generic class syntax — we need Generic[] for Python 3.13 compat
    "RUF006", # store asyncio.create_task ref — intentional fire-and-forget in partition processor
]

[tool.ruff.format]
quote-style = "single"

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    # Runtime-optional (users opt in via the `perf` extra), but pinned here so
    # the DEVELOPMENT environment always resolves it. `uv run` installs this
    # group unconditionally while `--extra=` selections vary per recipe —
    # fmt-check and lint pass `--extra=dev`, which re-syncs the venv and would
    # otherwise evict orjson before `typecheck` runs. Without this the import
    # in recorder/helpers.py resolves or not depending on which recipe ran
    # last, so no `ty: ignore` choice can be right in both cases.
    "orjson>=3.9",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ty>=0.0.24",
    "jsonschema>=4.23.0",
]

[tool.ty.src]
# Exclude test and integration directories from ``ty check`` — mocks and
# test-only patterns generate too many false positives. The ty LSP (used by
# Zed) still analyses these files when you open them, so navigation and
# inline hover info keep working.
exclude = ["tests", "integration"]

[tool.pyright]
# Editor/agent LSP only — ``ty`` remains the type checker CI gates on
# (``just typecheck``). Without these two keys pyright resolves against the
# interpreter that launched it rather than the project environment, so every
# third-party import reports as unresolved and the diagnostics drown out real
# findings.
venvPath = "."
venv = ".venv"

[tool.uv]
# Supply-chain mitigation: do not resolve packages published after this date.
# Bump this when intentionally upgrading dependencies (keep ~7 days behind
# today so freshly published, possibly malicious packages do not sneak in).
# exclude-newer = "2026-04-13"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
"integration/*" = ["ANN"]
"drakkar/uiserver/server.py" = ["ANN201", "ANN202"]  # FastAPI route return types inferred
