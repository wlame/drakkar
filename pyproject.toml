[project]
name = "py-drakkar"
dynamic = ["version"]
description = "Kafka subprocess orchestration framework"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "wlame" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    # 3.15 is still a release candidate; the full suite passes on it and the
    # published wheel is pure Python, so it needs no per-version build.
    "Programming Language :: Python :: 3.15",
    "Framework :: AsyncIO",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "confluent-kafka>=2.15.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "asyncpg>=0.30.0",
    "prometheus-client>=0.21.0",
    "structlog>=24.4.0",
    "pyyaml>=6.0.2",
    "aiosqlite>=0.20.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pymongo>=4.16.0",
    "httpx>=0.27.0",
    "redis>=5.2.0",
]

[project.scripts]
# Cache-management CLI for the decoupled drakkar-ui bundle; mirrors the Go
# backend's cmd/drakkar-ui (same subcommands, flags, output, exit codes).
drakkar-ui = "drakkar.uihost.cli:main"

# `perf` is the only published extra: an extra is something a CONSUMER of the
# library can opt into, and orjson is exactly that (a faster JSON encoder for
# the recorder). Development tooling lives in [dependency-groups] below,
# which is not published at all — `pip install py-drakkar[dev]` should not
# be a thing.
[project.optional-dependencies]
perf = [
    "orjson>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "drakkar/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["drakkar"]
artifacts = ["drakkar/uiserver/openapi.yaml", "drakkar/uiserver/swagger/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers -v"
# A hung test used to hold a runner until the 20-minute job cap and report
# nothing. This fails it with a traceback instead. The value is far above the
# slowest test (about 3 s) so it can only catch a genuine hang.
timeout = 60

[tool.coverage.run]
source = ["drakkar"]
omit = ["tests/*"]
# Line coverage says a line ran; it does not say both sides of an `if` or a
# `try` did. The framework's hard parts are the branches nobody takes on a
# good day — a drain that times out, a commit that fails, a sink that
# refuses — so those are exactly the ones the gate has to see.
branch = true

[tool.coverage.report]
show_missing = true
# Files at 100% say nothing an author has to act on; with branch coverage on,
# the full table is long enough that the ones that do get lost in it.
skip_covered = true
# The floor is on the combined line+branch measure (mirrored by coverage_min
# in the justfile). Turning branches on cost 0.98 pp, which was paid back by
# testing the paths it exposed rather than by lowering the number.
fail_under = 95

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "ANN",   # flake8-annotations
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific
]
ignore = [
    "ANN401", # dynamically typed expressions (Any)
    "ANN202", # missing return type for nested/private functions (FastAPI route handlers)
    "ANN002", # missing type annotation for *args
    "ANN003", # missing type annotation for **kwargs
    "E501",   # line too long (handled by formatter)
    "SIM105", # contextlib.suppress — doesn't work with async try/except
    "UP046",  # generic class syntax — we need Generic[] for Python 3.13 compat
    "RUF006", # store asyncio.create_task ref — intentional fire-and-forget in partition processor
]

[tool.ruff.format]
quote-style = "single"

# Every development tool, in one list. `uv run` and `uv sync` install this
# group by default, so each recipe gets the same environment without passing
# any selection flags — which is what keeps `just typecheck` and `just test`
# from re-syncing the venv against each other.
[dependency-groups]
dev = [
    "jsonschema>=4.23.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    # Runtime-optional — users opt in via the `perf` extra — but pinned here
    # so the DEVELOPMENT environment always resolves it. Without it the
    # import in recorder/helpers.py resolves or not depending on which recipe
    # ran last, so no `ty: ignore` choice could be right in both cases.
    "orjson>=3.9",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.11.0",
    "ty>=0.0.24",
]

[tool.ty.src]
# Exclude test and integration directories from ``ty check`` — mocks and
# test-only patterns generate too many false positives. The ty LSP (used by
# Zed) still analyses these files when you open them, so navigation and
# inline hover info keep working.
exclude = ["tests", "integration"]

[tool.pyright]
# Editor/agent LSP only — ``ty`` remains the type checker CI gates on
# (``just typecheck``). Without these two keys pyright resolves against the
# interpreter that launched it rather than the project environment, so every
# third-party import reports as unresolved and the diagnostics drown out real
# findings.
venvPath = "."
venv = ".venv"

[tool.uv]
# Supply-chain mitigation: do not resolve packages published after this date.
# A compromised release typically gets yanked within days, so refusing to
# resolve anything newer than roughly a week means an attack has to survive
# public scrutiny before it can reach a build here.
#
# Bump this deliberately when upgrading dependencies — keep it ~7 days behind
# the day you bump — and re-run `uv lock` so the change is visible in the
# lockfile diff rather than happening silently on someone's machine.
#
# Pinned as an explicit UTC instant, not a bare date: uv reads a bare date as
# local midnight and writes the resolved instant into uv.lock, so the same
# date produced a different lockfile line on every machine in a different
# timezone (UTC wrote T00:00:00Z, UTC+2 wrote T22:00:00Z) and the file
# churned on every re-lock.
exclude-newer = "2026-08-18T00:00:00Z"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
"integration/*" = ["ANN"]
"drakkar/uiserver/server.py" = ["ANN201", "ANN202"]  # FastAPI route return types inferred
